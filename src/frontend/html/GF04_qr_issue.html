<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('frontend/css/style'); ?>
  <!-- QRコード生成: qrcode-generator(MIT, Kazuhiko Arase)をCDN経由で利用。
       GF-04はPC専用画面でカメラ等の機微権限は不要のため、GAS HTML Serviceの
       サンドボックス制約(technical_verification.md 検証結果1)の対象外。 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    #qrCode svg { max-width: 220px; }
    @media print {
      body > *:not(#qrCard) { display: none !important; }
      #qrCard > *:not(#qrResult) { display: none !important; }
      #qrResult { display: block !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="page-header">
      <a href="<?!= scriptUrl ?>?page=GF01">&laquo; ダッシュボードへ戻る</a>
      <button id="logoutBtn" class="secondary" type="button">ログアウト</button>
    </div>
    <h1>QRコード発行</h1>

    <label for="itemName">品目名</label>
    <input type="text" id="itemName">

    <label for="threshold">アラート閾値</label>
    <input type="number" id="threshold" min="0" value="0">

    <label for="location">保管場所(任意)</label>
    <input type="text" id="location">

    <button id="issueBtn">発行する</button>
  </div>

  <div class="card">
    <h2>既存品目のQR再発行</h2>
    <p style="font-size:0.85rem; color:#64748b;">
      QRコードのラベルを紛失・破損した場合に、新規登録せず同じ品目IDでQRを再出力します。
    </p>
    <label for="reissueSelect">品目を選択</label>
    <select id="reissueSelect"></select>
    <button id="reissueBtn" class="secondary">再発行する</button>
  </div>

  <div class="card" id="qrCard">
    <div id="message" class="message"></div>

    <div id="qrResult" style="display:none; margin-top:16px; text-align:center;">
      <p>品目ID: <strong id="qrItemId"></strong></p>
      <div id="qrCode"></div>
      <p style="font-size:0.85rem; color:#64748b;">QRコードを印刷し、対象の部品箱に貼付してください。</p>
      <button id="printBtn" class="secondary">印刷</button>
    </div>
  </div>

  <?!= include('frontend/js/session'); ?>
  <script>
    var scriptUrl = <?!= JSON.stringify(scriptUrl) ?>;
    var session = requireSession(scriptUrl + '?page=GF00');

    document.getElementById('logoutBtn').addEventListener('click', function () {
      clearSession();
      window.top.location.href = scriptUrl + '?page=GF00';
    });

    function setMessage(text, type) {
      var msg = document.getElementById('message');
      msg.className = 'message' + (type ? ' ' + type : '');
      msg.textContent = text;
    }

    // 再発行プルダウンに既存品目(廃番除く)を読み込む。新規発行後にも呼び直して最新化する。
    function loadReissueOptions() {
      google.script.run
        .withSuccessHandler(function (res) {
          if (res.status !== 'OK') return;
          var select = document.getElementById('reissueSelect');
          var previousValue = select.value;
          select.innerHTML = '';
          res.data.items.forEach(function (item) {
            var opt = document.createElement('option');
            opt.value = item.itemId;
            opt.textContent = item.itemId + ' - ' + item.itemName;
            select.appendChild(opt);
          });
          if (previousValue) select.value = previousValue;
        })
        .withFailureHandler(function () {
          setMessage('品目一覧の取得に失敗しました。', 'error');
        })
        .getInventoryList({ token: session.token });
    }

    document.getElementById('reissueBtn').addEventListener('click', function () {
      var select = document.getElementById('reissueSelect');
      setMessage('');
      if (!select.value) {
        setMessage('再発行する品目を選択してください。', 'error');
        return;
      }
      showQr(select.value);
    });

    document.getElementById('issueBtn').addEventListener('click', function () {
      var itemName = document.getElementById('itemName').value.trim();
      var threshold = Number(document.getElementById('threshold').value);
      var location = document.getElementById('location').value.trim();
      setMessage('');

      if (!itemName) {
        setMessage('品目名を入力してください。', 'error');
        return;
      }

      var btn = document.getElementById('issueBtn');
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          if (res.status !== 'OK') {
            setMessage(res.message, 'error');
            return;
          }
          setMessage(res.message, 'success');
          showQr(res.data.itemId);
          loadReissueOptions();
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          setMessage('登録に失敗しました。時間をおいて再度お試しください。', 'error');
        })
        .issueQr({ token: session.token, itemName: itemName, threshold: threshold, location: location });
    });

    function showQr(itemId) {
      document.getElementById('qrItemId').textContent = itemId;
      var qr = qrcode(0, 'M');
      qr.addData(itemId);
      qr.make();
      document.getElementById('qrCode').innerHTML = qr.createSvgTag(6, 0);
      document.getElementById('qrResult').style.display = 'block';
    }

    document.getElementById('printBtn').addEventListener('click', function () {
      window.print();
    });

    if (session) {
      loadReissueOptions();
    }
  </script>
</body>
</html>
