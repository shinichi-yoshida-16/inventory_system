<script>
  // GAS HTML ServiceはCookieでのセッション保持ができないため、ログインで取得したトークンをsessionStorageに保持し、以後のgoogle.script.run呼び出しに毎回付与する(technical_verification.md 検証結果3)。
  var SESSION_KEY_ = 'inv_session';

  function saveSession(session) {
    sessionStorage.setItem(SESSION_KEY_, JSON.stringify(session));
  }

  function getSession() {
    var raw = sessionStorage.getItem(SESSION_KEY_);
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function clearSession() {
    sessionStorage.removeItem(SESSION_KEY_);
  }

  // 未ログインならログイン画面へ遷移し、nullを返す
  function requireSession(loginUrl) {
    var session = getSession();
    if (!session || !session.token) {
      window.top.location.href = loginUrl;
      return null;
    }
    return session;
  }

  // ボタン操作の応答有無が分かるよう、通信中はボタンをスピナー付きの無効表示に切り替える。
  // isLoading=falseで元のラベルへ戻す(2重呼び出し対策でoriginalHtmlは初回のみ保存)。
  function setButtonLoading(btn, isLoading, loadingLabel) {
    if (!btn) return;
    if (isLoading) {
      if (btn.dataset.originalHtml === undefined) {
        btn.dataset.originalHtml = btn.innerHTML;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>' + (loadingLabel || '処理中…');
    } else {
      btn.disabled = false;
      if (btn.dataset.originalHtml !== undefined) {
        btn.innerHTML = btn.dataset.originalHtml;
        delete btn.dataset.originalHtml;
      }
    }
  }
</script>
