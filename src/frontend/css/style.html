<style>
  :root {
    --color-primary: #2563eb;
    --color-danger: #dc2626;
    --color-success: #16a34a;
    --color-bg: #f8fafc;
    --color-border: #e2e8f0;
    --color-text: #1e293b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    margin: 0;
    padding: 16px;
  }
  h1 { font-size: 1.25rem; margin-top: 0; }
  h2 { font-size: 1.05rem; }
  a { color: var(--color-primary); }
  .card {
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 16px;
    max-width: 720px;
    margin: 0 auto 16px;
  }
  label { display: block; margin: 12px 0 4px; font-size: 0.9rem; }
  input[type="text"], input[type="email"], input[type="number"] {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    font-size: 1rem;
  }
  button {
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 16px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 12px;
    margin-right: 8px;
  }
  button.secondary { background: #64748b; }
  button.danger { background: var(--color-danger); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .message { margin-top: 12px; padding: 10px; border-radius: 4px; display: none; }
  .message.error { background: #fee2e2; color: var(--color-danger); display: block; }
  .message.success { background: #dcfce7; color: var(--color-success); display: block; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--color-border); font-size: 0.9rem; }
  tr.alert td { background: #fee2e2; }
  .nav-list { list-style: none; padding: 0; margin: 16px 0 0; }
  .nav-list li { margin-bottom: 8px; }
  .nav-list a {
    display: block;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    text-decoration: none;
    color: var(--color-text);
  }
  @media (max-width: 600px) {
    .pc-only { display: none !important; }
  }
  @media (min-width: 601px) {
    .mobile-only { display: none !important; }
  }
</style>
