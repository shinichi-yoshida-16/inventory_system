<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コードスキャン(入出庫登録)</title>
<style>
  :root {
    --color-primary: #2563eb;
    --color-danger: #dc2626;
    --color-success: #16a34a;
    --color-border: #e2e8f0;
    --color-text: #1e293b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    background: #f8fafc;
    color: var(--color-text);
    margin: 0;
    padding: 16px;
  }
  h1 { font-size: 1.2rem; }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--color-border);
  }
  .page-header a {
    color: var(--color-primary);
    font-size: 0.9rem;
    text-decoration: none;
  }
  .page-header button {
    margin: 0;
    padding: 6px 12px;
    font-size: 0.85rem;
  }
  #video { width: 100%; max-width: 480px; border-radius: 8px; background: #000; display: block; margin: 0 auto; }
  label { display: block; margin: 12px 0 4px; font-size: 0.9rem; }
  input[type="number"], input[type="text"] {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--color-border);
    border-radius: 4px;
    font-size: 1rem;
  }
  button {
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 12px;
    margin-right: 8px;
  }
  button.secondary { background: #64748b; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .type-toggle { margin-top: 12px; }
  .type-btn { background: #e2e8f0; color: var(--color-text); }
  .type-btn.active { background: var(--color-primary); color: #fff; }
  #errorMessage, #resultMessage { font-size: 0.95rem; }
  #errorView h1 { color: var(--color-danger); }
  #resultView h1 { color: var(--color-success); }
  #registerView p.hint { font-size: 0.85rem; color: #64748b; }
</style>
</head>
<body>
  <div id="app">
    <div class="page-header">
      <a id="backToDashboardLink" href="#">&laquo; ダッシュボードへ戻る</a>
      <button id="logoutBtn" class="secondary" type="button">ログアウト</button>
    </div>

    <div id="scanView">
      <h1>コードスキャン</h1>
      <video id="video" playsinline autoplay muted></video>
      <p id="scanStatus">カメラを起動しています…</p>
    </div>

    <div id="confirmView" style="display:none;">
      <h1>入出庫登録</h1>
      <p>品目ID: <strong id="confirmItemId"></strong></p>
      <p>品目名: <strong id="confirmItemName"></strong></p>
      <p>現在在庫数: <strong id="confirmStock"></strong></p>
      <div class="type-toggle">
        <button id="typeInBtn" class="type-btn" type="button">入庫</button>
        <button id="typeOutBtn" class="type-btn" type="button">出庫</button>
      </div>
      <label for="quantity">数量</label>
      <input type="number" id="quantity" min="1" value="1">
      <div>
        <button id="submitBtn">登録する</button>
        <button id="cancelBtn" class="secondary" type="button">スキャンに戻る</button>
      </div>
    </div>

    <div id="registerView" style="display:none;">
      <h1>新規品目登録</h1>
      <p class="hint">
        スキャンしたコードは未登録です。品目情報を入力すると、登録と同時に今回の1点を入庫として記録します。
      </p>
      <p>コード: <strong id="registerItemId"></strong></p>
      <label for="registerItemName">品目名</label>
      <input type="text" id="registerItemName">
      <label for="registerThreshold">アラート閾値</label>
      <input type="number" id="registerThreshold" min="0" value="0">
      <label for="registerLocation">保管場所(任意)</label>
      <input type="text" id="registerLocation">
      <div>
        <button id="registerSubmitBtn">登録して入庫する</button>
        <button id="registerCancelBtn" class="secondary" type="button">スキャンに戻る</button>
      </div>
    </div>

    <div id="resultView" style="display:none;">
      <h1 id="resultTitle">登録完了</h1>
      <p id="resultMessage"></p>
      <button id="rescanBtn">続けてスキャンする</button>
    </div>

    <div id="errorView" style="display:none;">
      <h1>エラー</h1>
      <p id="errorMessage"></p>
      <button id="retryBtn">再試行</button>
      <button id="toLoginBtn" class="secondary" style="display:none;">ログイン画面へ</button>
    </div>
  </div>

  <!-- ZXing-js: 自社発行QRに加え、メーカー添付のJANコード(EAN-13)・GS1 DataMatrix等も
       同一画面で読み取れるようマルチフォーマット対応ライブラリを使用する。
       (verification/gs1-datamatrix-scan/ での実機検証済み) -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@latest/umd/index.min.js"></script>
  <script>
    // ============================================================
    // 設定: 実際のGAS Webアプリ(/exec)URLは、リポジトリに直接コミットせず、
    // GitHub Actionsのシークレット(GAS_WEB_APP_URL)からビルド時に注入する
    // (.github/workflows/deploy-gf03-scan.yml 参照)。
    // ローカルで直接このファイルを開いて動作確認する場合のみ、このプレースホルダーを
    // 一時的に実URLへ書き換えて構わないが、コミットはしないこと。
    // ============================================================
    var GAS_WEB_APP_URL = '__GAS_WEB_APP_URL__';
    // ============================================================

    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    var returnUrl = params.get('returnUrl');

    // ダッシュボード(GF-01)遷移時にURLパラメータで渡されたreturnUrlへリンクする。
    // 無い場合はGAS本体のベースURL(?pageなし=GF-00ログイン画面)へフォールバックする。
    document.getElementById('backToDashboardLink').href = returnUrl || GAS_WEB_APP_URL;

    var currentItemId = null;
    var currentType = 'OUT';

    function showView(name) {
      ['scanView', 'confirmView', 'registerView', 'resultView', 'errorView'].forEach(function (v) {
        document.getElementById(v).style.display = v === name ? 'block' : 'none';
      });
    }

    function showError(message, fatal) {
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('toLoginBtn').style.display = fatal ? 'inline-block' : 'none';
      showView('errorView');
    }

    function init() {
      if (!token) {
        showError('セッション情報が見つかりません。ダッシュボード画面から再度アクセスしてください。', true);
        return;
      }
      // 「__」始まりのままなら、ビルド時のシークレット置換が行われていない(=未設定)と判定する。
      // ビルド時のsed置換はファイル内の完全一致テキストをすべて書き換えるため、この判定文に
      // プレースホルダーの完全な文字列をそのまま書くと、置換後にtrueのまま固定されてしまう
      // (実際に一度その不具合が発生した)。そのため先頭2文字のみで判定している。
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.indexOf('__') === 0) {
        showError('システム設定が未完了です(GAS_WEB_APP_URL未設定)。管理者にお問い合わせください。', false);
        return;
      }
      startCamera();
    }

    // ---- GS1 Application Identifier 簡易パーサ(verification/gs1-datamatrix-scan/ と同じロジック) ----
    var GS = String.fromCharCode(29); // FNC1はASCII Group Separator(0x1D)として表現される
    var GS1_AI_TABLE = [
      { ai: '00', length: 18 }, { ai: '01', length: 14 }, { ai: '02', length: 14 },
      { ai: '10', length: null }, { ai: '11', length: 6 }, { ai: '12', length: 6 },
      { ai: '13', length: 6 }, { ai: '15', length: 6 }, { ai: '17', length: 6 },
      { ai: '20', length: 2 }, { ai: '21', length: null }, { ai: '30', length: null },
      { ai: '37', length: null }, { ai: '90', length: null }, { ai: '91', length: null },
      { ai: '92', length: null }, { ai: '240', length: null }, { ai: '241', length: null },
      { ai: '250', length: null }, { ai: '400', length: null }
    ];

    function findAiDef(str, index) {
      for (var len = 4; len >= 2; len--) {
        var candidate = str.substr(index, len);
        for (var i = 0; i < GS1_AI_TABLE.length; i++) {
          if (GS1_AI_TABLE[i].ai === candidate) return GS1_AI_TABLE[i];
        }
      }
      return null;
    }

    function extractGtinFromGs1(raw) {
      var s = raw.replace(/^\]\w\d/, '');
      if (s.charAt(0) === GS) s = s.slice(1);

      var i = 0;
      while (i < s.length) {
        var def = findAiDef(s, i);
        if (!def) return null;
        var ai = def.ai;
        i += ai.length;

        var value;
        if (def.length) {
          value = s.substr(i, def.length);
          i += def.length;
        } else {
          var gsIndex = s.indexOf(GS, i);
          if (gsIndex === -1) {
            value = s.slice(i);
            i = s.length;
          } else {
            value = s.slice(i, gsIndex);
            i = gsIndex + 1;
          }
        }
        if (ai === '01') return value;
      }
      return null;
    }

    // 読み取ったバーコードの生データ・フォーマットから、在庫マスタの品目IDとして使う文字列を決定する。
    // - QRコード: 自社発行分は品目IDをそのままテキストで符号化しているため、生データをそのまま使う
    // - JANコード(EAN-13): 13桁の数字そのものがGTIN。GS1慣例に合わせ先頭に0を付与しGTIN-14化する
    // - それ以外(GS1 DataMatrix等): GS1要素文字列としてAI「01」(GTIN)を抽出する
    function extractItemId(result) {
      var rawText = result.getText();
      var format = result.getBarcodeFormat ? result.getBarcodeFormat() : null;

      if (format === ZXing.BarcodeFormat.EAN_13) {
        return '0' + rawText;
      }
      if (format === ZXing.BarcodeFormat.QR_CODE) {
        return rawText;
      }
      return extractGtinFromGs1(rawText);
    }

    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.PDF_417
    ]);
    var codeReader = new ZXing.BrowserMultiFormatReader(hints);

    function startCamera() {
      showView('scanView');
      document.getElementById('scanStatus').textContent = 'カメラを起動しています…';

      codeReader
        .decodeFromConstraints({ video: { facingMode: 'environment' } }, 'video', function (result, err) {
          if (result) {
            codeReader.reset();
            onDecoded(result);
          }
          // errはフレームごとに「まだ検出できていません」の通知としても飛んでくるため無視する
        })
        .then(function () {
          document.getElementById('scanStatus').textContent = 'コードを枠内に写してください';
        })
        .catch(function () {
          showError('カメラを起動できませんでした。ブラウザの設定でカメラの利用を許可してください。', false);
        });
    }

    function stopCamera() {
      codeReader.reset();
    }

    function onDecoded(result) {
      var itemId = extractItemId(result);
      if (!itemId) {
        showError('コードの形式を認識できませんでした。別のコードをお試しいただくか、管理者にご確認ください。', false);
        return;
      }
      currentItemId = itemId;

      callApi('getItemById', { itemId: itemId })
        .then(function (res) {
          if (res.status === 'OK') {
            document.getElementById('confirmItemId').textContent = res.data.item.itemId;
            document.getElementById('confirmItemName').textContent = res.data.item.itemName;
            document.getElementById('confirmStock').textContent = res.data.item.currentStock;
            document.getElementById('quantity').value = 1;
            selectType('OUT');
            showView('confirmView');
          } else if (res.data && res.data.code === 'ITEM_NOT_FOUND') {
            document.getElementById('registerItemId').textContent = itemId;
            document.getElementById('registerItemName').value = '';
            document.getElementById('registerThreshold').value = 0;
            document.getElementById('registerLocation').value = '';
            showView('registerView');
          } else {
            handleApiError(res);
          }
        })
        .catch(function () {
          showError('通信に失敗しました。電波状況をご確認のうえ再試行してください。', false);
        });
    }

    function selectType(type) {
      currentType = type;
      document.getElementById('typeInBtn').classList.toggle('active', type === 'IN');
      document.getElementById('typeOutBtn').classList.toggle('active', type === 'OUT');
    }

    document.getElementById('typeInBtn').addEventListener('click', function () { selectType('IN'); });
    document.getElementById('typeOutBtn').addEventListener('click', function () { selectType('OUT'); });

    document.getElementById('cancelBtn').addEventListener('click', function () {
      currentItemId = null;
      startCamera();
    });

    document.getElementById('registerCancelBtn').addEventListener('click', function () {
      currentItemId = null;
      startCamera();
    });

    document.getElementById('submitBtn').addEventListener('click', function () {
      var quantity = Number(document.getElementById('quantity').value);
      if (!(quantity > 0)) {
        alert('数量は1以上の数値で入力してください。');
        return;
      }
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;

      callApi('scanProcess', { itemId: currentItemId, type: currentType, quantity: quantity })
        .then(function (res) {
          btn.disabled = false;
          if (res.status !== 'OK') return handleApiError(res);
          showResult(res);
        })
        .catch(function () {
          btn.disabled = false;
          showError('通信に失敗しました。電波状況をご確認のうえ再試行してください。', false);
        });
    });

    document.getElementById('registerSubmitBtn').addEventListener('click', function () {
      var itemName = document.getElementById('registerItemName').value.trim();
      var threshold = Number(document.getElementById('registerThreshold').value);
      var location = document.getElementById('registerLocation').value.trim();

      if (!itemName) {
        alert('品目名を入力してください。');
        return;
      }
      if (!(threshold >= 0)) {
        alert('閾値は0以上の数値で入力してください。');
        return;
      }

      var btn = document.getElementById('registerSubmitBtn');
      btn.disabled = true;

      callApi('scanProcess', {
        itemId: currentItemId,
        type: 'IN',
        quantity: 1,
        itemName: itemName,
        threshold: threshold,
        location: location
      })
        .then(function (res) {
          btn.disabled = false;
          if (res.status !== 'OK') return handleApiError(res);
          showResult(res);
        })
        .catch(function () {
          btn.disabled = false;
          showError('通信に失敗しました。電波状況をご確認のうえ再試行してください。', false);
        });
    });

    function showResult(res) {
      document.getElementById('resultTitle').textContent = '登録完了';
      document.getElementById('resultMessage').textContent =
        res.message + '(現在在庫数: ' + res.data.currentStock + ')';
      showView('resultView');
    }

    document.getElementById('rescanBtn').addEventListener('click', function () {
      currentItemId = null;
      startCamera();
    });

    document.getElementById('retryBtn').addEventListener('click', function () {
      startCamera();
    });

    document.getElementById('toLoginBtn').addEventListener('click', function () {
      window.location.href = returnUrl || GAS_WEB_APP_URL;
    });

    // GF-03はGASのsessionStorageと別オリジンのためセッションを直接破棄できない。
    // カメラを止めてこのページ上のトークンを失効させたうえで、GAS側のログイン画面へ送る。
    document.getElementById('logoutBtn').addEventListener('click', function () {
      stopCamera();
      token = null;
      window.location.href = GAS_WEB_APP_URL + '?page=GF00';
    });

    // GASのdoPostはCORSのプリフライトを回避するため、
    // Content-Type: text/plain;charset=utf-8 固定でJSON文字列を送信する
    // (architecture/overview.md 4.1・6章、technical_verification.md 補足 参照)。
    function callApi(action, payload) {
      var body = Object.assign({ action: action, token: token }, payload);
      return fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      }).then(function (r) { return r.json(); });
    }

    function handleApiError(res) {
      var isTokenError = res.data && res.data.code === 'TOKEN_INVALID';
      if (isTokenError) {
        showError('セッションの有効期限が切れました。再度ログインしてください。', true);
      } else {
        showError(res.message || '処理に失敗しました。', false);
      }
    }

    init();
  </script>
</body>
</html>
