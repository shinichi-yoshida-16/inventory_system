name: Deploy GF-03 scan page to GitHub Pages

# 公開対象は以下の2つのみ。docs/(設計書)やsrc/core(GAS本体)は含めない。
#   - src/external/gf03-scan  : 本番のGF-03(GAS本体とは別ドメインで公開する外部無償ホスティング分)
#       → https://<user>.github.io/<repo>/
#   - verification/           : 技術検証用の使い捨てページ群(例: GS1 DataMatrix読み取り検証)
#       → https://<user>.github.io/<repo>/verification/<検証名>/
# 参照: docs/architecture/overview.md 3章, docs/requirements/technical_verification.md

on:
  push:
    branches: [main]
    paths:
      - 'src/external/gf03-scan/**'
      - 'verification/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # gf03-scanをサイトのルートに、verification配下を/verification/以下にまとめて配置する。
      - name: Build Pages site
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
        run: |
          mkdir -p _site
          cp -r src/external/gf03-scan/. _site/
          if [ -d verification ]; then
            mkdir -p _site/verification
            cp -r verification/. _site/verification/
          fi
          # リポジトリには実URLをコミットしない方針のため、ビルド時にシークレットで置換する。
          # 未設定の場合はプレースホルダーのままとし、GF-03側の未設定検知(init()内)に委ねる。
          if [ -n "$GAS_WEB_APP_URL" ]; then
            find _site -name '*.html' -print0 | xargs -0 sed -i "s|__GAS_WEB_APP_URL__|${GAS_WEB_APP_URL}|g"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
